<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mathew Joseph | Software and applied machine learning</title>
  <desc id="desc">A dark blue banner with mint geometric lines. Building accessible tools, from backend systems to applied machine learning.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1525"/><stop offset="1" stop-color="#142a38"/></linearGradient>
